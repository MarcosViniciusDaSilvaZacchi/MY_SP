; PlatformIO — firmware da cancela do MY Service Parking (Fase 2)
; Abra a pasta "iot" no VS Code (PlatformIO: Open Project) e use Build / Upload.
;
; Antes de compilar: copie esp32-cancela/config.example.h para
; esp32-cancela/config.h e preencha Wi-Fi, IP do PC e chave.
;
; Para gravar o teste de bancada (sem servidor), troque src_dir abaixo para
; esp32-teste-local.

[platformio]
src_dir = esp32-cancela
default_envs = esp32dev

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 921600
; O Bluetooth Clássico ocupa bastante flash: usa a partição de app grande (3 MB, sem OTA)
board_build.partitions = huge_app.csv
lib_deps =
    bblanchon/ArduinoJson@^7
    madhephaestus/ESP32Servo@^3
